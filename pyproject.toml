[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "notes-ai"
version = "1.0.0"
description = "Turn any social media video URL into structured AI-generated notes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["video", "notes", "transcription", "ai", "youtube", "assemblyai", "groq"]
dependencies = [
    "click>=8.0",
    "groq>=0.9.0",
    "assemblyai>=0.30.0",
    "python-dotenv>=1.0.0",
    "yt-dlp>=2024.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/notes-ai"

[project.scripts]
notes-ai = "notes_ai.cli:cli"
notes-ai-web = "notes_ai.web_app:run_server"

[tool.setuptools.packages.find]
where = ["src"]