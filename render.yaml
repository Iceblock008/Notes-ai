services:
  - type: web
    name: video-notes-ai
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: PORT
        value: "8080"
      - key: HOST
        value: "0.0.0.0"
    autoDeploy: true